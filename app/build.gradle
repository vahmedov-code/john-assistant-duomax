plugins { id 'com.android.application' }

def localSigning = new Properties()
def signingFile = rootProject.file('signing.properties')
if (signingFile.exists()) {
    signingFile.withInputStream { localSigning.load(it) }
}

android {
    namespace 'moscow.avior.john'
    compileSdk 34
    defaultConfig {
        applicationId 'moscow.avior.john'
        minSdk 26
        targetSdk 32
        versionCode 3
        versionName '0.3'
        testInstrumentationRunner 'moscow.avior.john.VoiceSmokeInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint {
        // Sideloaded YaOS app: preserve the station-tested target 32, not a Google Play submission.
        disable 'ExpiredTargetSdkVersion'
    }
    if (signingFile.exists()) {
        signingConfigs {
            localTest {
                storeFile rootProject.file(localSigning.getProperty('storeFile'))
                storePassword localSigning.getProperty('storePassword')
                keyAlias localSigning.getProperty('keyAlias')
                keyPassword localSigning.getProperty('keyPassword')
            }
        }
        buildTypes {
            debug { signingConfig signingConfigs.localTest }
        }
    }
}

dependencies {
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    testImplementation 'junit:junit:4.13.2'
}
