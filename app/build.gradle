plugins { id 'com.android.application' }

def localSigning = new Properties()
def signingFile = rootProject.file('signing.properties')
if (signingFile.exists()) {
    signingFile.withInputStream { localSigning.load(it) }
}

android {
    namespace 'moscow.avior.john'
    compileSdk 34
    defaultConfig {
        applicationId 'moscow.avior.john'
        minSdk 26
        targetSdk 32
        versionCode 2
        versionName '0.2-test'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    if (signingFile.exists()) {
        signingConfigs {
            localTest {
                storeFile rootProject.file(localSigning.getProperty('storeFile'))
                storePassword localSigning.getProperty('storePassword')
                keyAlias localSigning.getProperty('keyAlias')
                keyPassword localSigning.getProperty('keyPassword')
            }
        }
        buildTypes {
            debug { signingConfig signingConfigs.localTest }
        }
    }
}
